font_family      0xProto Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0
# ---------------------------------------------------------------
# macOS Golden Gate look
# ---------------------------------------------------------------

# frosted glass (Hyprland blurs what's behind)
background_opacity       0.88
dynamic_background_opacity yes
window_padding_width     10 14
hide_window_decorations  yes
confirm_os_window_close  0

# warm dark palette with macOS system accents
foreground               #ffffff
background               #1c1816
selection_foreground     #ffffff
selection_background     #5a4f49
cursor                   #f5f1ee
cursor_text_color        #1c1816
cursor_shape             beam
cursor_beam_thickness    1.6
url_color                #64d2ff

color0  #3a3532
color8  #8a807a
color1  #ff453a
color9  #ff6961
color2  #32d74b
color10 #5fe377
color3  #ffd60a
color11 #ffe14d
color4  #0a84ff
color12 #5aa9ff
color5  #bf5af2
color13 #d189f5
color6  #64d2ff
color14 #8fe0ff
color7  #ece6e2
color15 #ffffff

# subtle, rounded-look tab bar
tab_bar_style            separator
tab_separator            " "
active_tab_foreground    #ffffff
active_tab_background    #4a413c
inactive_tab_foreground  #a39a94
inactive_tab_background  #2a2523
tab_bar_background       #1c1816
tab_bar_margin_width     6
tab_bar_margin_height    6 0

# thin inactive-window dimming and borders
inactive_text_alpha      0.9
active_border_color      #5a4f49
inactive_border_color    #2a2523
window_border_width      0.5pt
